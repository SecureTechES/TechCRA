 <p><b>Receptoras asociadas:</b> ${y.rec.length?y.rec.map(r=>rn(r.id)+' ('+r.rol+')').join(' · '):'<i>ninguna</i>'}</p>`}
 <p><button class='b' data-a='sy:${y.id}'>Editar sistema</button>${cc?'':` <button class='b' data-a='vi+:${y.id}'>Añadir vía</button> <button class='b' data-a='sr:${y.id}'>Receptoras del sistema</button>`} <button class='b' data-a='sq:${y.id}'>Quitar sistema</button></p></fieldset>`}).join('')||`<div class='box'>Sin sistemas registrados.</div>`)};
function dlgSys(s,y){const n=!y,d=y||{tipo:'Intrusión',marca:'',modelo:'',cuenta:s.id,prot:'Contact ID',estado:'Activo',rem:false,rip:'',rpt:'',rus:'',rpw:''};

function sysFields(){const t=$('sy_t').value,cc=t==='CCTV',rem=t==='Intrusión'&&$('sy_r').checked;
 document.querySelectorAll('.sf_rc').forEach(e=>e.hidden=cc);
 document.querySelectorAll('.sf_in').forEach(e=>e.hidden=t!=='Intrusión');
 document.querySelectorAll('.sf_ip').forEach(e=>e.hidden=!(cc||rem));
 document.querySelectorAll('.sf_cc').forEach(e=>e.hidden=!cc)}
function doSys(s,id){const v=x=>$(x).value.trim(),ipok=a=>/^\d{1,3}(\.\d{1,3}){3}$/.test(a)&&a.split('.').every(o=>+o<256),ptok=a=>/^\d+$/.test(a)&&+a>0&&+a<65536;
 let y=s.sys.find(z=>z.id===id);const n=!y,t=v('sy_t'),cc=t==='CCTV',rem=t==='Intrusión'&&$('sy_r').checked;
 if(!v('sy_m')&&!v('sy_o'))return toast('Indica marca o modelo');
 if((cc||rem)&&!ipok(v('sy_i')))return toast('Indica una IP pública válida');
 if((cc||rem)&&!ptok(v('sy_pt')))return toast('Indica un puerto válido (1-65535)');
 if(cc&&!v('sy_u'))return toast('Indica el usuario de acceso al grabador');
 if(n){y={id:'SY-'+(s.sys.length?Math.max(...s.sys.map(z=>+z.id.slice(3)))+1:1),vias:[],rec:[]};s.sys.push(y)}
 Object.assign(y,{tipo:t,estado:v('sy_e'),marca:v('sy_m'),modelo:v('sy_o'),cuenta:cc?'—':(v('sy_c')||s.id),prot:cc?'—':v('sy_p'),rem,rip:cc||rem?v('sy_i'):'',rpt:cc||rem?v('sy_pt'):'',rus:cc?v('sy_u'):'',rpw:cc?$('sy_w').value:''});
 syncSys(s);log(s,1999,'SISTEMA '+(n?'añadido':'modificado')+': '+y.tipo+' '+y.marca+' '+y.modelo+(cc||rem?' - acceso remoto '+y.rip+':'+y.rpt:'')+' - '+y.estado);$('dlg').close();toast('Sistema guardado');all()}

 dlgOpen((n?'Nueva vía':'Editar vía')+' · '+esc(y.tipo)+' '+esc(y.marca),`<div class='dg'><label>Tipo de vía${sel('vi_t',VIAT)}</label><label>Prioridad${sel('vi_p',['1','2','3','4'])}</label></div>
 <div class='dg vf_ip'><label>IP pública de la red (si tiene)<input type='text' id='vi_ip' value='${esc(d.ip)}'></label><label>DDNS (si tiene)<input type='text' id='vi_dd' value='${esc(d.ddns)}'></label></div>
 <label class='vf_gp'>ICCID de la SIM<input type='text' id='vi_ic' inputmode='numeric' value='${esc(d.iccid)}'></label>
 <label class='vf_tl'>Nº de línea telefónica<input type='text' id='vi_tl' value='${esc(d.tel)}'></label>
 <div class='dg'><label>Supervisión (test periódico)${sel('vi_s',SUP)}</label><label>Receptora${sel('vi_r',['Sin receptora',...RECS.map(r=>r.n)])}</label></div>`,
 `<button class='b' data-a='viok:${y.id}:${n?'new':v.id}'>Guardar vía</button>${n?'':`<button class='b' data-a='viq:${y.id}:${v.id}'>Quitar vía</button>`}`);

function viaFields(){const t=$('vi_t').value;
 document.querySelectorAll('.vf_ip').forEach(e=>e.hidden=t!=='IP');
 document.querySelectorAll('.vf_gp').forEach(e=>e.hidden=t!=='GPRS / 4G');

function doVia(s,y,id){const g=x=>$(x).value.trim(),tp=g('vi_t'),ic=g('vi_ic').replace(/ /g,''),ip=g('vi_ip');
 if(tp==='GPRS / 4G'&&!/^\d{18,22}$/.test(ic))return toast('El ICCID debe tener entre 18 y 22 dígitos');
 if(tp==='IP'&&ip&&!(/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)&&ip.split('.').every(o=>+o<256)))return toast('La IP pública no es válida');
 if(tp==='Teléfono (PSTN)'&&!g('vi_tl'))return toast('Indica el número de línea');
 let v=y.vias.find(z=>z.id===id);const n=!v;if(n){v={id:'V-'+(y.vias.length?Math.max(...y.vias.map(z=>+z.id.slice(2)))+1:1)};y.vias.push(v)}
 const ri=$('vi_r').selectedIndex;
 Object.assign(v,{tipo:tp,ip:tp==='IP'?ip:'',ddns:tp==='IP'?g('vi_dd'):'',iccid:tp==='GPRS / 4G'?ic:'',tel:tp==='Teléfono (PSTN)'?g('vi_tl'):'',prio:+g('vi_p'),sup:g('vi_s'),rec:ri?RECS[ri-1].id:''});
 if(v.rec&&!y.rec.some(r=>r.id===v.rec))y.rec.push({id:v.rec,rol:y.rec.length?'Respaldo':'Principal'});
 syncSys(s);log(s,1999,'VÍA '+(n?'añadida':'modificada')+' en '+y.tipo+' '+y.marca+': '+v.tipo+' ('+viaDet(v)+') prio '+v.prio+' - '+v.sup);$('dlg').close();toast('Vía guardada');all()}
function dlgSR(s,y){dlgOpen('Receptoras del sistema · '+esc(y.tipo)+' '+esc(y.marca),`<p class='hl'>Marca las receptoras que reciben las señales de este sistema y su papel.</p>${RECS.map((r,i)=>{const a=y.rec.find(x=>x.id===r.id),rs=a&&a.rol==='Respaldo';return`<div style='display:flex;gap:8px;align-items:center'><input type='checkbox' class='sr_c' value='${r.id}' id='sr${i}'${a?' checked':''}><label for='sr${i}' style='flex:1;display:block'>${esc(r.n)}<br><span class='hl'>${esc(r.t)}</span></label><select class='sr_r'><option${rs?'':' selected'}>Principal</option><option${rs?' selected':''}>Respaldo</option></select></div>`}).join('')}`,`<button class='b' data-a='srok:${y.id}'>Guardar</button>`)}
function doSR(s,y){const cs=[...document.querySelectorAll('.sr_c')],rl=[...document.querySelectorAll('.sr_r')],n=cs.map((c,i)=>c.checked?{id:c.value,rol:rl[i].value}:null).filter(Boolean);

function pop(b){const p=$('pop'),it=MENU[b.dataset.m];if(!p.hidden&&p.dataset.o===b.dataset.m){p.hidden=true;return}
