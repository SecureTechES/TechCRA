 <fieldset><legend>Datos de la alarma</legend><div class="fl"><span class="ico">🚨</span><div style="flex:1"><div class="yt"${al?'':' style="background:var(--hd)"'}>${al?CODES[s.ev[0]][0]:'Sin alarma'}</div><dl class="kv">${al?kv('Prioridad',s.pri+' &nbsp; Hora: '+fmt(s.at)):''}${kv('Sistema','1 - '+s.panel)}${kv('Área','1 - Área por defecto')}${kv('Zona',al?esc(s.ev[1]):'—')}${kv('Tx','1 - '+s.com)}</dl></div></div></fieldset></div>
 <div><div class="box"><table>${dr(al?CL[s.st]:'var(--ok)','Alarma',al?(act?'En gestión (1)':ST[s.st]+' (1)'):'Sin alarmas')}${dr('var(--ok)','Monitorización','Activa - '+s.t+' - Cuenta principal')}${dr('var(--ok)','Zona horaria','Europe/Madrid')}${dr('var(--ok)','Servicio','Completo')}<tr><td colspan="2"><b>Teléfonos</b></td></tr>${area(1,ar)}${area(2,ar2)}</table></div>
 <fieldset style="margin-top:6px"><legend>Patrón de acción - ${esc(s.n.split(' ')[0].toUpperCase())}</legend><div>${[['ap','Patrón de acción'],['ct','Ver todos los contactos'],['cl','Ver todas las listas de llamadas']].map(([v,l])=>`<label style="margin-right:12px;white-space:nowrap"><input type="radio" name="v" data-v="${v}"${view===v?' checked':''}> ${l}</label>`).join('')}</div><div class="tw" style="margin-top:4px"><table>${view==='ap'?apT:view==='ct'?ctT:clT}</table></div></fieldset></div></div>
 <fieldset><legend>Registro del abonado</legend><div class="fl"><div style="min-width:80px"><label><input type="radio" name="sp" data-sp="w"${span==='w'?' checked':''}> Semana</label><br><label><input type="radio" name="sp" data-sp="m"${span==='m'?' checked':''}> Mes</label><br><button class="b" style="margin-top:6px" disabled>Más</button></div>
 <div class="tw lg${wrap?' wr':''}" style="flex:1"><table><tr><th>Fecha</th><th>Hora</th><th>Descripción</th><th>Usuario</th></tr>${ev.map((e,i)=>{const ty=CODES[e.c][1];return`<tr class="${ty==='proc'?'rG':ty==='ok'?'':i===0&&al?'rA':'rS'}"><td>${ty==='proc'?'':dmy(e.t)}</td><td>${hms(e.t)}</td><td>${ty==='proc'?esc(e.d):(ty==='ok'?'SEÑAL':'ALARMA')+' - '+CODES[e.c][0]+' ['+e.c+'] '+esc(e.d)}</td><td>${e.u}</td></tr>`}).join('')}</table></div></div></fieldset>`};
P[2]=s=>`<fieldset><legend>Planes y planos</legend><div class="box" style="aspect-ratio:16/9;max-height:320px;position:relative;background-image:repeating-linear-gradient(0deg,transparent 0 23px,#8883 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,#8883 23px 24px)">${s.z.split('|').map((z,i)=>`<span class="dt" title="${esc(z)}" style="position:absolute;left:${8+i*15%80}%;top:${12+i*37%70}%;--c:${zs(s,i)?'var(--al)':'var(--ok)'}"></span>`).join('')}</div><p style="color:var(--mu)">Aquí se integrará tu visor de planos con detectores, expansores, cámaras y fuentes.</p></fieldset>`;
P[3]=s=>{const r=s.t==='Industria'?[['Lun-Sáb','06:00','22:00'],['Domingo','Cerrado','']]:s.t==='Comercio'||s.t==='Oficina'?[['Lun-Vie','08:30','20:30'],['Sábado','09:00','14:00'],['Domingo','Cerrado','']]:[['Todos los días','Sin horario','']];
 return`<fieldset><legend>Horario de apertura y cierre</legend><div class="tw"><table><tr><th>Días</th><th>Apertura</th><th>Cierre</th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</table></div></fieldset>`};
P[4]=s=>`<fieldset><legend>Informe de alarma</legend><div class="tw"><table><tr><th>Fecha</th><th>Evento</th><th>Detalle</th><th>Usuario</th></tr>${s.events.filter(e=>CODES[e.c][1]!=='ok').map(e=>`<tr><td>${fmt(e.t)}</td><td>${CODES[e.c][0]} [${e.c}]</td><td>${esc(e.d)}</td><td>${e.u}</td></tr>`).join('')}</table></div></fieldset>`;
P[5]=s=>`<fieldset><legend>Comentarios</legend><div class="tw"><table><tr><th>Fecha</th><th>Usuario</th><th>Comentario</th></tr>${s.cm.map(c=>`<tr class="wr"><td>${c[0]}</td><td>${c[1]}</td><td style="white-space:normal">${esc(c[2])}</td></tr>`).join('')}</table></div><p><textarea id="cmt" rows="3" style="width:100%;background:var(--pn);border:1px solid var(--ln)" placeholder="Nuevo comentario"></textarea><button class="b" data-a="cm">Añadir comentario</button></p></fieldset>`;
P[6]=s=>`<fieldset><legend>Estado de zonas</legend><div class="tw"><table><tr><th>Zona</th><th>Descripción</th><th>Tipo</th><th>Estado</th></tr>${s.z.split('|').map((z,i)=>`<tr class="${zs(s,i)?'rA':''}"><td>${pad(i+1)}</td><td>${esc(z)}</td><td>${/Humo/.test(z)?'Incendio':/ánico/.test(z)?'Pánico':'Intrusión'}</td><td>${zs(s,i)?'Disparada':'Reposo'}</td></tr>`).join('')}</table></div></fieldset>`;
P[7]=s=>`<fieldset><legend>Canal inverso · ${s.com}</legend><p>Envía órdenes a la central ${s.panel}:</p>${['Armar','Desarmar','Estado','Reiniciar sirena'].map(x=>`<button class="b" data-a="rc:${x}">${x}</button> `).join('')}</fieldset>`;
P[8]=s=>`<fieldset><legend>Partes de servicio y mantenimientos</legend><div class="tw"><table><tr><th>Tipo</th><th>Fecha</th><th>Estado</th></tr>${s.m.map(m=>{const p=m.split('|');return`<tr><td>${p[0]}</td><td>${p[1]}</td><td>${p[2]}</td></tr>`}).join('')}</table></div><p><button class="b" data-a="part">Nuevo parte de servicio</button></p></fieldset>`;
P[9]=s=>s.cams?`<fieldset><legend>Cámaras (${s.cams})</legend><div class="cams">${Array.from({length:Math.min(s.cams,6)},(_,i)=>`<div class="cam"><span>CAM ${i+1}</span><button class="b" data-a="todo">Ver</button></div>`).join('')}</div></fieldset>`:'<div class="box">Este abonado no tiene cámaras asociadas.</div>';
function tree(){
 const d=(k,l,body)=>`<button class="nd" style="--d:0" data-f="${k}">${op.has(k)?'⊟':'⊞'} 📁 ${l}</button>${op.has(k)?body:''}`;
 const it=(dp,l,a,id,sel)=>`<button class="nd${sel?' sel':''}" style="--d:${dp}"${id?` data-id="${id}"`:''}${a?` data-a="${a}"`:''}>${l}</button>`;
 const lab=s=>`<i class="dt" style="--c:${CL[s.st]}"></i>${s.id} - ${esc(s.n)}`;
 const list=a=>a.length?a.map(s=>it(2,lab(s),0,s.id,cur&&cur.id===s.id)).join(''):it(2,'<span style="color:var(--mu)">(vacío)</span>');
 let h='';
 if(qs){const r=S.filter(s=>(s.n+s.id+s.a).toLowerCase().includes(qs));h+=d('Resultados','Resultados ('+r.length+')',list(r))}
 h+=d('Actual','Actual',(cur&&isA(cur)?it(2,'Alarma - '+CODES[cur.ev[0]][0],0,cur.id,1):'')+it(2,'Señal manual','man')+(cur?it(2,'Cliente - '+lab(cur),0,cur.id):''));
 h+=d('Cola de alarmas','Cola de alarmas ('+queue().length+')',list(queue()));
 h+=d('Atajos','Atajos',it(2,'Buscar abonado','srch')+it(2,'Siguiente alarma','next')+it(2,'Nuevo parte de servicio','part'));
 h+=d('Alarmas en seguimiento','Alarmas en seguimiento',list(S.filter(s=>s.tr)));
 h+=d('Alarmas suspendidas','Alarmas suspendidas',list(S.filter(s=>s.st==='susp')));
 h+=d('Clientes recientes','Clientes recientes',list(rec.map(id=>S.find(s=>s.id===id))));
 h+=d('Clientes con alarmas recientes','Clientes con alarmas recientes',list(S.filter(s=>s.events.some(e=>isAl(e.c)))));
 $('tn').innerHTML=nav==='nav'?h:nav==='notes'?`<textarea id="nt" placeholder="Notas del operador">${esc(notes)}</textarea>`:'<div class="box" style="margin:4px">Sin mensajes instantáneos.</div>';
 document.querySelectorAll('.tt button').forEach(b=>b.classList.toggle('on',b.dataset.nav===nav));
}
function pt(){$('pt').innerHTML=['Alarma','Planes','Horario','Informe de alarma','Comentarios','Estado de zonas','Canal inverso','Partes de servicio','Cámaras'].map((n,i)=>`<button data-a="p${i+1}" class="${tab===i+1?'on':''}"${!cur||(i===6&&!cur.rc)?' disabled':''}>${n} - ${i+1}</button>`).join('')}
function foot(){
 const a=S.filter(isA),n=Array(10).fill(0);a.forEach(s=>n[s.pri-1]++);
 const isN=s=>isSig(s)&&!s.vw,isV=s=>isSig(s)&&s.vw,c=(v,w)=>`<span class="c${v?' h':''}" style="min-width:${w||44}px">${v}</span>`;
 $('cn').innerHTML='<b>Contadores:</b>'+n.map((v,i)=>`<b>${i+1}${i>8?'+':''}:</b>${c(v)}`).join('')+`<b>Total:</b>${c(a.length)}`;
 $('c2').innerHTML=`<b>Suspendidas:</b>${c(S.filter(s=>s.st==='susp').length,80)}<b>Nuevas:</b>${c(S.filter(isN).length,80)}<b>Vistas:</b>${c(S.filter(isV).length,80)}<b>Gestionadas:</b>${c(S.filter(s=>s.st==='proc').length,80)}`;
 const t=S.filter(isN).sort((x,y)=>x.pri-y.pri)[0],m=$('m');
 m.className='m'+(t&&!clr?'':' calm');
 m.textContent=t&&!clr?`[${hm(t.at)}] Alarma sin gestionar: ${CODES[t.ev[0]][0]} de prioridad ${t.pri} - ${t.n}`:'Sin mensajes';
}
const all=()=>{tree();$('pg').innerHTML=pg();pt();foot()};
function openC(id){cur=S.find(s=>s.id===id);tab=1;view='ap';rec=[id,...rec.filter(x=>x!==id)].slice(0,6);
 if(!cur.vw&&isSig(cur)){cur.vw=true;log(cur,1999,'VISTO - '+CODES[cur.ev[0]][0]+' - Respuesta [1 seg]')}
 if(innerWidth<=820)document.body.classList.remove('tr');all()}
function act(k){
 if(k==='tree')return document.body.classList.toggle('tr');
 if(k==='theme'){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;return r.dataset.theme=dk?'light':'dark'}
 if(k==='clr'){clr=true;return foot()}
 if(k==='todo')return toast('Pendiente de conectar (solo frontend)');
 if(k==='about')return toast('CRA · prototipo de frontend');
 if(k==='print')return print();
 if(k==='srch'){document.body.classList[innerWidth<=820?'add':'remove']('tr');nav='nav';tree();return $('q').focus()}
 if(k==='next'){const n=queue()[0];return n?openC(n.id):toast('No hay alarmas pendientes')}
 const s=cur;if(!s)return toast('Selecciona primero un abonado');
 if(/^p\d$/.test(k)){if(k==='p7'&&!s.rc)return toast('Este abonado no tiene canal inverso');tab=+k[1];return all()}
 if(k==='man')log(s,1999,'SEÑAL MANUAL registrada por el operador');
 else if(k==='trk'){s.tr=!s.tr;log(s,1999,s.tr?'ALARMA en seguimiento':'Seguimiento cancelado');toast(s.tr?'Alarma en seguimiento':'Seguimiento cancelado')}
 else if(k==='part'){s.m.unshift('Parte manual|'+dmy(new Date())+'|Pendiente');tab=8;toast('Parte de servicio creado')}
 else if(k[0]==='c'&&k.length===2){const c=s.c[+k[1]]||s.c[0];log(s,1999,'CONTACTAR CON '+c[0].toUpperCase()+' AL '+c[2]+' - Resultado: llamada realizada');toast('Llamando a '+c[0])}
 else if(k==='acuda'){log(s,1999,'AVISO a servicio de acuda');toast('Acuda avisado')}
 else if(k==='sms'){log(s,1999,'SMS enviado a '+s.c[0][0]);toast('SMS enviado')}
 else if(k==='cm'){const v=$('cmt').value.trim();if(!v)return;s.cm.unshift([fmt(new Date()),'OP1',v])}
 else if(k.startsWith('rc:')){log(s,1999,'COMANDO INVERSO - '+k.slice(3)+' - Pendiente de envío a FEP');toast('Comando enviado: '+k.slice(3))}
 else if(k.startsWith('s:')){if(!isA(s))return toast('No hay alarma activa');s.st='susp';log(s,1999,'ALARMA SUSPENDIDA '+k.slice(2));toast('Alarma suspendida')}
 else if(k.startsWith('f:')){if(!isA(s))return toast('No hay alarma activa');s.st='ok';s.step=0;log(s,1999,'RESOLUCIÓN - '+CODES[s.ev[0]][0]+' - Res: '+k.slice(2));toast('Alarma finalizada')}
 else if(k==='do'){const st=steps(s);if(!isA(s))return toast('No hay alarma activa');
  if(s.st!=='proc'){s.st='proc';s.step=0;s.vw=true;log(s,1999,'ACCIÓN - Alarma tomada por el operador')}
  else if(s.step<st.length){log(s,1999,st[s.step]);s.step++;if(s.step>=st.length)toast('Patrón completado: usa Finalizar')}}
 all()}
function pop(b){const p=$('pop'),it=MENU[b.dataset.m];if(!p.hidden&&p.dataset.o===b.dataset.m){p.hidden=true;return}
 p.innerHTML=it.map(x=>`<button data-a="${x[1]}">${x[0]}</button>`).join('');p.dataset.o=b.dataset.m;p.hidden=false;
 const r=b.getBoundingClientRect();p.style.left=Math.max(0,Math.min(r.left,innerWidth-p.offsetWidth-4))+'px';p.style.top=r.bottom+'px'}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(!b){$('pop').hidden=true;return}
 if(b.dataset.m)return pop(b);
 $('pop').hidden=true;
 if(b.dataset.id)return openC(b.dataset.id);
 if(b.dataset.f){op.has(b.dataset.f)?op.delete(b.dataset.f):op.add(b.dataset.f);return tree()}
 if(b.dataset.nav){nav=b.dataset.nav;return tree()}
 if(b.dataset.a)act(b.dataset.a)});
document.addEventListener('change',e=>{const d=e.target.dataset;
 if(d.v){view=d.v;$('pg').innerHTML=pg()}
 if(d.sp){span=d.sp;$('pg').innerHTML=pg()}
 if(e.target.id==='wr'){wrap=e.target.checked;$('pg').innerHTML=pg()}});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){qs=e.target.value.toLowerCase();op.add('Resultados');tree()}
 if(e.target.id==='nt')notes=e.target.value});
setInterval(()=>{$('dt').textContent=dmy(new Date())+' '+hms(new Date())},1000);$('dt').textContent=dmy(new Date())+' '+hms(new Date());
document.body.classList.remove('tr');
openC(queue()[0].id);
</script>
</body>
</html>
